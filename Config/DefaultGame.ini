+DirectoriesToAlwaysCook=(Path="/Game/BattleForTheA/Data")

; ---------------------------------------------------------------------------
; Assets the game loads by string path from C++.
;
; The cooker follows property references. LoadObject(TEXT("/Game/...")) is not
; one, so an asset that only ever appears inside a C++ string can be absent from
; a cooked build, and the component falls back to the engine's default material
; or to nothing at all. Checked against the build 131 cook: five assets the code
; loads by string were not in it, and they are what these four folders carry.
;
;   /Game/BattleForTheA/Environment/KrogIncident/M_ScooterMetal    the scooter's frame
;   /Game/BattleForTheA/Environment/KrogIncident/M_ScooterTrim     the scooter's deck
;   /Game/BattleForTheA/Traffic/SM_RoadCarHull                     every road car's body
;   /Game/BattleForTheA/Environment/CrashReview/SM_TenthRoadDoubleSided
;   /Game/Vehicles/SportsCar/SKM_SportsCar                         the car review rig
;
; Two of them were named on every run of the packaged sweep, 35 and 41 times.
; The other three are on paths the sweep never exercises, so they were silent.
;
; The sports car folder is here for one Development-only asset, the skeletal mesh
; the car-palette review tool loads by string. The same folder holds
; ABP_SportsCar, a sample blueprint whose parent class lives in the ChaosVehicles
; plugin this project does not enable; the cook logs load failures for it and
; leaves it out of the package. That is noise rather than damage - the cook
; completes and the packaged sweep is clean on it - but it is why that name shows
; up in the cooker's warnings. The car the player sees is the static
; SM_SportsCar, which something else references and which is cooked regardless.
;
; DirectoriesToAlwaysCook is the setting this engine version has; the same audit
; found DT_Difficulty, the rider crash physics, the sleep clips, the Kroger
; storefront brick and glass, the bench wood and the crowd materials all cooked
; and loading correctly, most of them because something else references them.
; An earlier attempt used AdditionalPackagesToCook, which this engine reads only
; as a legacy per-asset header field and not as a project setting, so it changed
; nothing at all.
;
; If a new asset is ever loaded only from a C++ string, its folder belongs here.
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/BattleForTheA/Environment/CrashReview")
+DirectoriesToAlwaysCook=(Path="/Game/BattleForTheA/Environment/KrogIncident")
+DirectoriesToAlwaysCook=(Path="/Game/BattleForTheA/Traffic")
+DirectoriesToAlwaysCook=(Path="/Game/Vehicles/SportsCar")
+DirectoriesToAlwaysCook=(Path="/Game/BattleForTheA/Spirit")

; GameFeatures must be an explicit project plugin: the CommonConversation
; registry calls UGameFeaturesSubsystem::Get().AddObserver() when a world
; starts, and in a packaged build that subsystem only exists if the
; GameFeatures runtime module is actually enabled for the game target. Without
; this line the cook also refuses with "Asset manager settings do not include a
; rule for assets of type GameFeatureData" (the exit-25 trap that cost three
; cooks on 2026-09-18 and was misattributed to Aura), and the packaged game
; segfaults at world init. With it, both problems go away together.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
